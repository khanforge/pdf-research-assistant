services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
  
  app:
    build: .
    container_name: rag_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - qdrant

volumes:
  qdrant_storage: